name: Generate Contribution Snake

on:
  schedule:
    # Runs once every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23f97316&color_dots=%23fff7ed,%23fed7aa,%23fdba74,%23fb923c,%23f97316
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23fbbf24&color_dots=%23161b22,%23783400,%23c2410c,%23f97316,%23fdba74

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
